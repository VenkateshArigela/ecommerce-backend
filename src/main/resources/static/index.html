<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h3>Products</h3>

        <div>
            <button id="loginBtn" class="btn btn-primary" onclick="goToLogin()">Login</button>
            <button id="logoutBtn" class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="adminSection" class="card p-3 mb-4">
        <h5>Add Product</h5>
        <input id="name" class="form-control mb-2" placeholder="Product Name">
        <input id="price" class="form-control mb-2" placeholder="Price">
        <button class="btn btn-success" onclick="addProduct()">Add Product</button>
    </div>

    <div id="products" class="row"></div>

</div>

<script>

    const token = localStorage.getItem("token");

    // UI control
    if (token) {
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
    } else {
        document.getElementById("loginBtn").style.display = "inline-block";
        document.getElementById("logoutBtn").style.display = "none";
        document.getElementById("adminSection").style.display = "none";
    }

    // Load products (PUBLIC)
    function loadProducts() {
        fetch("http://localhost:8080/products")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("products");
            container.innerHTML = "";

            data.forEach(p => {
                container.innerHTML += `
                    <div class="col-md-4">
                        <div class="card p-3 mb-3">
                            <h5>${p.name}</h5>
                            <p>₹ ${p.price}</p>
                        </div>
                    </div>
                `;
            });
        });
    }

    // Add product (only works if token exists)
    function addProduct() {

        if (!token) {
            alert("Login required");
            return;
        }

        const name = document.getElementById("name").value;
        const price = document.getElementById("price").value;

        fetch("http://localhost:8080/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ name, price })
        })
        .then(() => loadProducts());
    }

    // Login redirect
    function goToLogin() {
        window.location.href = "auth.html";
    }

    // Logout
    function logout() {
        localStorage.removeItem("token");
        window.location.reload();
    }

    window.onload = loadProducts;

</script>

</body>
</html>
